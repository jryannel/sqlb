{{define "content"}}
<div class="mb-3 d-flex align-items-start justify-content-between">
  <div>
    <a href="/tables/{{.Table.Name}}/rows" class="btn btn-link px-0">&larr; {{.Table.Name}}</a>
    <h2 class="page-title mt-2">{{.Table.Name}} row</h2>
  </div>
  {{if .CanEdit}}<a href="{{.EditLink}}" class="btn btn-primary mt-2">Edit</a>{{end}}
</div>

<div class="card">
  <div class="card-body">
    <dl class="row mb-0">
      {{range .Fields}}
      <dt class="col-3">{{.Name}}</dt>
      <dd class="col-9">
        {{if .Link}}<a href="{{.Link}}">{{.Value}}</a>{{else}}{{.Value}}{{end}}
      </dd>
      {{end}}
    </dl>
  </div>
</div>

{{if .Actions}}
<div class="card mt-3">
  <div class="card-header"><h3 class="card-title">Actions</h3></div>
  <div class="card-body d-flex gap-2">
    {{range .Actions}}<a href="{{.InvokeLink}}" class="btn btn-outline-primary">{{.Name}}</a>{{end}}
  </div>
</div>
{{end}}
{{end}}
