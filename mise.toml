# sqlb tasks and pinned toolchain.
#
#   mise tasks          list what is here
#   mise run ci         the full gate, same as .github/workflows/ci.yml
#   mise run test       the inner loop
#
# Tool versions are pinned so every checkout and CI runner builds and lints with
# the same toolchain.
[tools]
# Matches studio-apps, so sqlb is developed against the toolchain it will be
# consumed by. go.mod deliberately declares a *lower* minimum (1.25): a library
# should not force its consumers onto a newer toolchain than it needs.
go = "1.26.4"
# Pinned for the same reason as in studio-apps: a newer golangci-lint can add or
# redefine analyzers and turn a green tree red, or quietly stop reporting a real
# finding. Bump deliberately, then run `mise run lint`.
golangci-lint = "2.12.2"

# ---- Tasks ----

[tasks.test]
description = "Run all tests. No Docker and no Postgres needed: the engine's tests run against an in-memory database/sql driver, so hooks, scanning and the mutation paths are covered without a live database."
run = "go test ./..."

[tasks.test-race]
description = "Run all tests with the race detector. Worth running before touching anything that caches per-type state — the model cache, the hook registry, or Describe, which mutates a cached model on purpose and is only safe at init."
run = "go test -race ./..."

[tasks.cover]
description = "Run tests with coverage and print the per-function summary. Writes coverage.out, which is gitignored."
run = '''
go test -coverprofile=coverage.out ./...
go tool cover -func=coverage.out | tail -20
'''

[tasks.vet]
description = "go vet across the module"
run = "go vet ./..."

[tasks.lint]
description = "golangci-lint across the module"
run = "golangci-lint run"

[tasks.lint-fix]
description = "golangci-lint --fix (applies autofixes; review the diff)"
run = "golangci-lint run --fix"

[tasks.fmt]
description = "gofmt -w across the files git tracks. Run `mise run fmt-check` to see what it would change."
run = '''
# Scoped to tracked files for the reason spelled out under fmt-check, and more
# urgently here: `gofmt -w .` *rewrites* what it walks, so an unrelated checkout
# under .claude/worktrees/ would be reformatted underneath whoever is working in
# it.
files=$(git ls-files '*.go')
if [ -z "$files" ]; then
  echo "fmt: no tracked Go files"; exit 1
fi
printf '%s\n' "$files" | xargs gofmt -w
'''

[tasks.fmt-check]
description = "Fail if anything needs gofmt. Run `mise run fmt` to fix."
run = '''
# Scoped to the files git tracks, not `gofmt -l .`. The recursive walk descends
# into .claude/worktrees/, which .git/info/exclude ignores and which holds
# unrelated parallel checkouts, so the gate failed naming a file that is not
# part of this repository at all. `fmt-check` was the only gate with that
# exposure: vet, lint, test-race, generate-check and bisect-check all reach the
# tree through the go tool's `./...`, which skips directories whose name begins
# with a dot. ADR-0018 has the rule this follows and why fmt-check is kept even
# though golangci-lint's gofmt formatter currently covers the same ground.
files=$(git ls-files '*.go')
if [ -z "$files" ]; then
  echo "fmt-check: no tracked Go files, so nothing was checked"; exit 1
fi
# gofmt's own failure (a parse error, a tracked file deleted from the worktree)
# empties the list and would otherwise read as clean — ADR-0016.
if ! unformatted=$(printf '%s\n' "$files" | xargs gofmt -l); then
  echo "fmt-check: gofmt failed, so nothing was verified"; exit 1
fi
if [ -n "$unformatted" ]; then
  echo "needs gofmt:"; echo "$unformatted"; exit 1
fi
'''

[tasks.tidy]
description = "go mod tidy"
run = "go mod tidy"

[tasks.tidy-check]
description = "Fail if go.mod or go.sum would change. Catches a dependency added but not tidied."
run = '''
cp go.mod go.mod.bak
[ -f go.sum ] && cp go.sum go.sum.bak
go mod tidy
status=0
diff -q go.mod go.mod.bak >/dev/null || { echo "go.mod is not tidy; run: mise run tidy"; status=1; }
mv go.mod.bak go.mod
[ -f go.sum.bak ] && mv go.sum.bak go.sum
exit $status
'''

[tasks.deps-check]
description = "Fail if a third-party dependency has crept into the engine. Everything on the request path depends on the standard library only, on purpose: it is a library, and every dependency it takes is one its consumers inherit. Exactly two packages are exempt — `rest`, which is an adapter onto huma, and the generated example that mounts it — so importing `sqlb` still costs nothing."
run = '''
# The check the module-wide version could not express: sqlb now has an HTTP
# adapter, so "zero dependencies anywhere" is no longer the invariant. What must
# hold is that a consumer importing the engine inherits nothing.
#
# ADR-0016: a guard must be proven in both directions, so this one ends by
# checking that it *does* fire for `rest`. Three earlier guards in this repo
# reported success while verifying nothing.
allowed='github.com/jryannel/sqlb/rest github.com/jryannel/sqlb/example/blog'

# third_party lists the non-stdlib, non-sqlb packages one package imports,
# transitively. A stdlib path has no dot in its first element, which is what
# distinguishes it from a module path — and is why an earlier version that
# grepped for "golang.org/x" matched the standard library's own vendored copies.
third_party() {
  go list -deps "$1" | grep -E '^[^/]+\.[^/]+/' | grep -v '^github.com/jryannel/sqlb' | sort -u
}

if ! pkgs=$(go list ./... 2>&1); then
  echo "deps-check: could not resolve packages, so nothing was verified:"
  printf '%s\n' "$pkgs" | sed 's/^/  /'
  exit 1
fi

checked=0
fail=0
for pkg in $pkgs; do
  case " $allowed " in *" $pkg "*) continue ;; esac
  checked=$((checked + 1))
  if deps=$(third_party "$pkg") && [ -n "$deps" ]; then
    echo "$pkg has third-party dependencies:"
    printf '%s\n' "$deps" | sed 's/^/  /'
    fail=1
  fi
done

if [ "$checked" -eq 0 ]; then
  echo "deps-check: no packages were checked, so nothing was verified"
  exit 1
fi
[ "$fail" -eq 0 ] || exit 1

# The positive control. If this stops reporting huma, the check above has
# stopped being able to see a dependency at all and its silence means nothing.
if ! third_party github.com/jryannel/sqlb/rest | grep -q '^github.com/danielgtaylor/huma'; then
  echo "deps-check: the check cannot see a dependency it should — rest imports huma but none was found"
  exit 1
fi

echo "deps-check: $checked packages, standard library only"
'''

[tasks.generate]
description = "Regenerate models, the typed column facade and the manifest from every schema package."
run = "go generate ./..."

[tasks.generate-check]
description = "Fail if committed generated code does not match what the schema would produce now. Generated code is committed, so it drifts: someone edits a schema, forgets to regenerate, and the models silently describe a table that no longer exists. Part of `ci`, in the same spirit as the sqlc-check gate in studio-apps."
run = "go run ./example/blog/gen -check"

[tasks.bisect-check]
description = "Verify every commit builds, vets and tests green on its own, not just at HEAD. Checks each commit out into a temp tree so a commit cannot be green by accident of later work. Keeps `git bisect` trustworthy; it is the guard that is easiest to lose without noticing. Set BASE to limit the range, e.g. BASE=origin/main..HEAD."
run = '''
# mise runs tasks under `set -e`, so a command whose failure is expected must
# be guarded by `if`, not by reading $? afterwards — an earlier version died on
# the very first commit (which legitimately has no Go packages yet) and printed
# nothing at all, reporting a broken history that was in fact fine.
tmp=$(mktemp -d)
trap 'rm -rf "$tmp"' EXIT
fail=0

for sha in $(git rev-list --reverse "${BASE:-HEAD}"); do
  short=$(git log -1 --format=%h "$sha")
  subject=$(git log -1 --format=%s "$sha")
  rm -rf "$tmp/wt"
  mkdir -p "$tmp/wt"
  git archive "$sha" | tar -x -C "$tmp/wt"

  if out=$(cd "$tmp/wt" && go build ./... 2>&1 && go vet ./... 2>&1 && go test ./... 2>&1); then
    printf "  %-9s PASS  %s\n" "$short" "$subject"
  elif printf "%s" "$out" | grep -qE "no packages to (test|vet)|matched no packages"; then
    # A commit before any Go package exists is legitimately empty, not broken.
    printf "  %-9s PASS  %s  (no packages yet)\n" "$short" "$subject"
  else
    printf "  %-9s FAIL  %s\n" "$short" "$subject"
    printf "%s" "$out" | tail -5 | sed 's/^/             /'
    fail=1
  fi
done

if [ "$fail" -ne 0 ]; then
  echo
  echo "history is not bisectable"
  exit 1
fi
echo
echo "every commit builds, vets and tests green in isolation"
'''

[tasks.ci]
description = "The full gate, run locally. A faithful mirror of .github/workflows/ci.yml: fmt-check, vet, lint, tidy-check, deps-check, generate-check, test-race. Does not include bisect-check, which CI runs only on pull requests since it is linear in the number of commits."
run = '''
set -e
mise run fmt-check
mise run vet
mise run lint
mise run tidy-check
mise run deps-check
mise run generate-check
mise run test-race
echo
echo "ci: all gates passed"
'''
