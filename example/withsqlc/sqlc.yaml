# sqlc reads the schema sqlb generated. There is one schema declaration in this
# repository — example/blog/blogschema — and this is downstream of it.
#
#   go generate ./example/withsqlc/...   regenerate schema.sql
#   sqlc generate                        retype sqlcgen against it, by hand
#
# The second is not a go:generate directive: sqlc is not a pinned toolchain
# here, and making it one would make it a build dependency of the library. See
# doc.go.
version: "2"
sql:
  - engine: postgresql
    schema: schema.sql
    queries: query.sql
    gen:
      go:
        package: sqlcgen
        out: sqlcgen
        # pgx, because sqlb is pgx (ADR-0040). This is the line that makes the
        # two halves share a transaction rather than merely share a database:
        # one pgx.Tx satisfies sqlb.Executor and the DBTX below at once.
        sql_package: pgx/v5
        # Left off deliberately. The claim under test is that sqlb.Describe
        # reads *stock* sqlc output, mapping Go field names to columns by
        # snake_case when there is no db tag. Turning this on would make the
        # test pass for an easier reason than the one that matters.
        emit_db_tags: false
        overrides:
          # sqlb declares these as UUIDv7 primary keys. Mapping them to string
          # rather than a uuid package keeps this example dependency-free,
          # which the repository's deps-check gate requires of everything
          # outside `rest` and the blog example.
          - db_type: "uuid"
            go_type: "string"
