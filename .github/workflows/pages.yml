# Builds the documentation site and deploys it to GitHub Pages.
#
# Separate from `ci` on purpose. The site is Astro, so folding it into the gate
# would make Node a build dependency of a Go library whose whole argument is that
# it imposes none — the same reasoning that keeps sqlc out of the gate. A red
# site build should not be able to say the library is broken.
#
# `npm run build` runs the link check, so a link that would 404 after deploy
# fails here instead of shipping.
name: pages

on:
  push:
    branches: [main]
    # The site is generated from docs/, so an edit there has to redeploy it.
    #
    # Deliberately the whole directory rather than the published subset. This
    # filter listed docs/guide/** when the guide was the only source, and adding
    # docs/adr/ and docs/ silently outgrew it: ADR-0022 was committed, CI was
    # green, and the page 404d because no deploy ran. A filter that has to be
    # widened every time SOURCES grows is a filter that will be wrong again.
    # Building on an unpublished docs/ change is cheap; not building on a
    # published one is invisible.
    paths:
      - "site/**"
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel one midway: a cancelled deploy can
# leave the site serving a half-published build.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json
      # ci rather than install: the lockfile is committed, so the runner builds
      # what was resolved locally instead of re-resolving.
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
